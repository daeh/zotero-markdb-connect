nodeLinker: pnpm

packageExtensions:
  # Depends on typescript-eslint without declaring the typescript peer it needs,
  # which splits typescript-eslint into two instances ("Cannot redefine plugin").
  "@zotero-plugin/eslint-config@*":
    peerDependencies:
      typescript: "*"
  # Its declarations import "react" without declaring it.
  "zotero-plugin-toolkit@*":
    dependencies:
      "@types/react": "^18.3.28"
