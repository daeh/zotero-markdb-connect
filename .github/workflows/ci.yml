name: CI

on:
  push:
    branches:
      - main
      - "release-candidate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Node 25+ no longer bundles Corepack; a pinned one is installed to manage Yarn.
  COREPACK_VERSION: "0.36.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pinned Corepack
        run: |
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
        shell: bash
        working-directory: ${{ runner.temp }}

      - name: Verify toolchain
        id: toolchain
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          expected_yarn="$(node -p 'const m = /^yarn@([^+]+)\+sha512\./.exec(require("./package.json").packageManager); if (!m) process.exit(1); m[1]')"
          test "$(yarn --version)" = "$expected_yarn"
          echo "cache-folder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.cache-folder }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable
        shell: bash

      - name: Lint without changes
        run: yarn lint-dry
        shell: bash

      - name: Typecheck
        run: yarn typecheck
        shell: bash

      - name: Unit tests
        run: yarn test
        shell: bash

      - name: Build
        run: yarn build
        shell: bash

      - name: Generated typings must not drift
        run: git diff --exit-code -- typings/i10n.d.ts typings/prefs.d.ts
        shell: bash

      - name: Upload build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-result
          path: .scaffold/build
          # .scaffold is a dot-directory, excluded by upload-artifact by default.
          include-hidden-files: true
          if-no-files-found: error

  zotero:
    name: Zotero ${{ matrix.zotero.version }} integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # One pinned runtime per supported Zotero major.
        zotero:
          - version: "10.0"
            sha256: fad10b2bee0b6178248a0ffb7b4add0bc2b1e71088f47d5549423e1cc80034b8
    env:
      ZOTERO_ARCHIVE: .cache/zotero/Zotero-${{ matrix.zotero.version }}_linux-x86_64.tar.xz
      ZOTERO_RUNTIME: .cache/zotero/runtime-${{ matrix.zotero.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pinned Corepack
        run: |
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
        shell: bash
        working-directory: ${{ runner.temp }}

      - name: Verify toolchain
        id: toolchain
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          expected_yarn="$(node -p 'const m = /^yarn@([^+]+)\+sha512\./.exec(require("./package.json").packageManager); if (!m) process.exit(1); m[1]')"
          test "$(yarn --version)" = "$expected_yarn"
          echo "cache-folder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.cache-folder }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable
        shell: bash

      - name: Install Zotero runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2t64 libdbus-glib-1-2 x11-xkb-utils xkb-data xvfb
        shell: bash

      - name: Cache Zotero ${{ matrix.zotero.version }} archive
        id: zotero-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZOTERO_ARCHIVE }}
          key: zotero-linux-${{ matrix.zotero.version }}-${{ matrix.zotero.sha256 }}

      - name: Download Zotero ${{ matrix.zotero.version }}
        if: steps.zotero-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/zotero
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$ZOTERO_ARCHIVE" \
            "https://download.zotero.org/client/release/$ZOTERO_VERSION/Zotero-${ZOTERO_VERSION}_linux-x86_64.tar.xz"
        shell: bash
        env:
          ZOTERO_VERSION: ${{ matrix.zotero.version }}

      - name: Verify Zotero archive
        run: echo "$ZOTERO_SHA256  $ZOTERO_ARCHIVE" | sha256sum --check --strict
        shell: bash
        env:
          ZOTERO_SHA256: ${{ matrix.zotero.sha256 }}

      - name: Extract Zotero
        run: |
          mkdir -p "$ZOTERO_RUNTIME"
          tar --extract --xz --file "$ZOTERO_ARCHIVE" --directory "$ZOTERO_RUNTIME"
          test -x "$ZOTERO_RUNTIME/Zotero_linux-x86_64/zotero"
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$GITHUB_WORKSPACE/$ZOTERO_RUNTIME/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"
        shell: bash

      - name: Run in-Zotero tests
        # The scaffold starts its own Xvfb when CI is set. Scaffold 0.9.4 exits 0
        # whenever Zotero closes without a failure count, including when it exits
        # before reporting any result, so require the reporter's success-form
        # completion line as well.
        run: |
          yarn test:zotero 2>&1 | tee zotero-test.log
          grep -Eq 'Test run completed - [1-9][0-9]* passed$' zotero-test.log \
            || { echo "::error::The Zotero test run never reported a completed, passing run"; exit 1; }
        shell: bash
        env:
          CI: true

      - name: Upload Zotero test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zotero-${{ matrix.zotero.version }}-test-log
          path: zotero-test.log
          if-no-files-found: warn
          retention-days: 7
