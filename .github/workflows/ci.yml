name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # zotero-types uses public GitHub dependencies recorded as SSH URLs.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
  GIT_CONFIG_VALUE_0: "ssh://git@github.com/"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --allow-git=all
        shell: bash

      - name: Format check
        run: npm run format:check
        shell: bash

      - name: Lint
        run: npm run lint:check
        shell: bash

      - name: Typecheck
        run: npm run typecheck
        shell: bash

      - name: Unit tests
        run: npm run test
        shell: bash

      - name: Build
        run: npm run build
        shell: bash

      - name: Generated typings must not drift
        run: git diff --exit-code -- typings/i10n.d.ts typings/prefs.d.ts
        shell: bash

  zotero:
    name: Zotero 9.0.6 integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --allow-git=all
        shell: bash

      - name: Install Zotero runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2t64 libdbus-glib-1-2 x11-xkb-utils xkb-data xvfb
        shell: bash

      - name: Cache Zotero 9.0.6 archive
        id: zotero-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/zotero/Zotero-9.0.6_linux-x86_64.tar.xz
          key: zotero-linux-9.0.6-0db6e8f94bd0d84e862e6ef5c3e217030e173c0cd3c6dfbc836252c650fea3dd

      - name: Download Zotero 9.0.6
        if: steps.zotero-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/zotero
          curl --fail --location --retry 3 --retry-all-errors \
            --output .cache/zotero/Zotero-9.0.6_linux-x86_64.tar.xz \
            https://download.zotero.org/client/release/9.0.6/Zotero-9.0.6_linux-x86_64.tar.xz
        shell: bash

      - name: Verify Zotero archive
        run: |
          echo '0db6e8f94bd0d84e862e6ef5c3e217030e173c0cd3c6dfbc836252c650fea3dd  .cache/zotero/Zotero-9.0.6_linux-x86_64.tar.xz' \
            | sha256sum --check --strict
        shell: bash

      - name: Extract Zotero
        run: |
          mkdir -p .cache/zotero/runtime
          tar --extract --xz \
            --file .cache/zotero/Zotero-9.0.6_linux-x86_64.tar.xz \
            --directory .cache/zotero/runtime
          test -x .cache/zotero/runtime/Zotero_linux-x86_64/zotero
        shell: bash

      - name: Run in-Zotero tests
        run: npm run test:zotero 2>&1 | tee zotero-test.log
        shell: bash
        env:
          CI: true
          ZOTERO_PLUGIN_ZOTERO_BIN_PATH: ${{ github.workspace }}/.cache/zotero/runtime/Zotero_linux-x86_64/zotero

      - name: Upload Zotero test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zotero-9.0.6-test-log
          path: zotero-test.log
          if-no-files-found: warn
          retention-days: 7
